# ============================================================
# VAULTWARDEN  HARDENED SELF-HOSTED PASSWORD MANAGER
# ============================================================
# Reference: .\RULES.md
#
# Source: https://github.com/dani-garcia/vaultwarden
# Update cadence: Tier 0  Alert only, manual review required
# Last reviewed: 2026-09-16
#
# Clients: All official Bitwarden apps (desktop, mobile, browser, CLI, web)
# Database: SQLite (WAL mode)  single-file, trivial backup
# Crypto: AES-256-CBC + HMAC-SHA256 (client-side, zero-knowledge)
# KDF: Argon2id (configure in account settings post-deploy)
# ============================================================

# REUSABLE ANCHORS

# Logging json-file with rotation to prevent disk exhaustion
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "3"
      tag: "{{.Name}}/{{.ID}}"

# Health check baseline
x-healthcheck-defaults: &healthcheck-base
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 15s

# SERVICES

services:

  # VAULTWARDEN SERVER
  vaultwarden:
    # Pin to exact patch version NEVER :latest for Tier 0 service
    # Source: https://github.com/dani-garcia/vaultwarden/releases
    # Registry: GHCR (primary, consistent with Authentik/TasmoAdmin stacks)
    image: ghcr.io/dani-garcia/vaultwarden:1.37.3-alpine@sha256:9a905c5cf5df61bb827da3805e160170741c0b53b0c63bb07e1afd3d2e21b1c8

    container_name: infrastructure-vaultwarden-1

    # macvlan for LAN accessibility via VLAN 20
    mac_address: 02:42:0a:00:14:13

    <<: *default-logging

    # Non-root execution
    # Vaultwarden alpine supports UID 1000. Host dir must be chown'd to match.
    user: "1000:1000"

    # Privilege escalation prevention
    security_opt:
      - no-new-privileges:true

    # Drop ALL capabilities  Vaultwarden needs none
    cap_drop:
      - ALL

    # Immutable root filesystem
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    # Resource limits  Vaultwarden is extremely lightweight (~30MB idle)
    # pids limit prevents fork bombs
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 100
        reservations:
          cpus: '0.10'
          memory: 64M

    # ALL secrets via _FILE pattern  NEVER plaintext env vars
    environment:
      # CORE SETTINGS
      # DOMAIN must exactly match the URL you access Vaultwarden from.
      # Used for OIDC redirect URI generation, CSRF, and HSTS.
      DOMAIN: ${VAULTWARDEN_DOMAIN_URL}

      # HAProxy sets X-Real-IP to the real client IP (via CF-Connecting-IP).
      # Without this, rate limiting and brute-force bans target the proxy, not the attacker.
      IP_HEADER: "X-Real-IP"

      # REGISTRATION LOCKDOWN & QUOTAS 
      SIGNUPS_ALLOWED: "false"
      SSO_SIGNUPS_ALLOWED: "true"          # NEW 1.37.3: Prevents SSO users from creating new vaults! # enabled to allow sign-ups via Authentik
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      PASSWORD_HINTS_ALLOWED: "false"       # Hardened server-side hint rejection
      ORG_CREATION_USERS: ${VW_ORG_CREATION_USERS}            # Prevents arbitrary organization creation
      REQUIRE_DEVICE_EMAIL: "true"          # Require email confirmation for new client devices
      USER_ATTACHMENT_LIMIT: 102400         # 100MB max per user to prevent disk fill
      ORG_ATTACHMENT_LIMIT: 512000          # 500MB max per organization
      TRASH_AUTO_DELETE_DAYS: 30            # Automatically prune soft-deleted items after 30d

      # ADMIN PANEL
      # Token is an Argon2id hash. Generate with:
      # docker run --rm -it ghcr.io/dani-garcia/vaultwarden:1.37.3-alpine /vaultwarden hash
      # Using _FILE avoids dollar-sign escaping in compose
      ADMIN_TOKEN: ${VW_ADMIN_TOKEN}
      # WEBSOCKET (real-time sync for desktop/browser) 
      WEBSOCKET_ENABLED: "true"

      # PUSH NOTIFICATIONS (mobile live sync) 
      # Register at https://bitwarden.com/host for free ID+Key
      # No vault data is transmitted  only sync signals via APNs/FCM
      PUSH_ENABLED: "true"
      PUSH_INSTALLATION_ID: ${VW_PUSH_ID}
      PUSH_INSTALLATION_KEY: ${VW_PUSH_KEY}
      # ICON PRIVACY 
      # SECURITY: Prevents domain leakage via favicon cache on server disk
      DISABLE_ICON_DOWNLOAD: "true"
      ICON_CACHE_TTL: 0                     # Disable icon cache expiration sweeps
      ICON_CACHE_NEGTTL: 0

      # SMTP (same Gmail relay as Authentik stack) 
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: 587
      SMTP_SECURITY: "starttls"
      SMTP_FROM: "vaultwarden@sythsaz.ca"
      SMTP_FROM_NAME: "Vaultwarden"
      SMTP_USERNAME: ${VW_SMTP_USERNAME}
      SMTP_PASSWORD: ${VW_SMTP_PASSWORD}
      # SSO / OIDC (Authentik Integration) 
      # Authentication only master password still required to decrypt vault.
      # Authentik OIDC provider must be configured first (see walkthrough).
      # Redirect URI in Authentik: https://vault.sythsaz.ca/identity/connect/oidc-signin
      SSO_ENABLED: "true"
      SSO_AUTHORITY: "https://auth.sythsaz.ca/application/o/vaultwarden/"
      SSO_SCOPES: "openid email profile"
      SSO_CLIENT_ID: ${VW_SSO_CLIENT_ID}
      SSO_CLIENT_SECRET: ${VW_SSO_CLIENT_SECRET}
      # SSO_ONLY: "false" keep master password login as fallback
      # If Authentik goes down, you can still login with email+master password
      SSO_SIGNUPS_MATCH_EMAIL: "true"
      SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION: "false" # Ensure IdP verifies email before account matching

      # LOGGING & FAIL2BAN INTEGRATION 
      # Production log level no debug leakage
      LOG_FILE: "/data/vaultwarden.log" # Write to persistent bind mount for Fail2ban monitoring
      LOG_LEVEL: "warn"
      EXTENDED_LOGGING: "true"

      # RATE LIMITING 
      LOGIN_RATELIMIT_SECONDS: 60
      LOGIN_RATELIMIT_MAX_BURST: 5
      ADMIN_RATELIMIT_SECONDS: 60
      ADMIN_RATELIMIT_MAX_BURST: 3

      # ACCESS CONTROL 
      # Emergency access (dead-man switch for trusted contacts)
      EMERGENCY_ACCESS_ALLOWED: "true"
      # Bitwarden Send (encrypted ephemeral sharing)
      SENDS_ALLOWED: "true"

    # Docker Secrets  mounted at /run/secrets/<name>

    # Persistent data  contains SQLite DB, RSA keys, attachments
    # Bind mount consistent with all Dell server stacks (/home/hassio/<service>)
    # Pre-create: ssh hassio@10.0.20.221 "mkdir -p /home/hassio/vaultwarden && chown 1000:1000 /home/hassio/vaultwarden"
    volumes:
      - /home/hassio/vaultwarden:/data

    # NO direct port binding  LAN access via macvlan IP only
    # Access at https://vault.sythsaz.ca or http://10.0.20.19

    # Network isolation  macvlan for LAN, no proxy-net needed
    networks:
      vlan20_servers:
        ipv4_address: 10.0.20.19

    # Health check  /alive endpoint confirmed in Vaultwarden docs
    # Using curl as newer images often drop wget
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/alive"]
      start_period: 30s

    # WUD labels  Tier 0: alert only, NO auto-update
    # CRITICAL SERVICE: Manual review + staged rollback required before any update
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"
      - "wud.watch=true"
      - "wud.trigger.type=discord"
      ## Ignore changes to digests to bring back latest ver num instead of tag
      - "wud.watch.digest=false"
      # NOTE: No wud.update=true  Tier 0 requires manual review
      - "autoheal=true"
    restart: unless-stopped

#  SECRETS 
# Decrypted from .enc files at deploy time by deploy-remote.ps1
# The plaintext files are ephemeral  created during deploy, never committed
# See .gitignore: **/secrets/* is excluded, only *.enc files are tracked

#  NETWORKS 

networks:
  # Reuse existing macvlan for VLAN 20 LAN access
  # Created by the infrastructure stack  shared across dell-server stacks
  vlan20_servers:
    external: true
    name: infrastructure_vlan20_servers

# Note: No named volumes  using bind mount at /home/hassio/vaultwarden
