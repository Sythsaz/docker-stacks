x-default-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "3"

services:
  loki:
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"
      - "wud.watch=true"
      - "wud.update=true"
      - "wud.update.type=patch"
      ## Ignore changes to digests to bring back latest ver num instead of tag
      - "wud.watch.digest=false"
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    container_name: loki
    <<: *default-logging
    restart: unless-stopped
    user: "10001:10001"
    environment:
      CONFIG_HASH: ${STACK_CONFIG_HASH:-}
    volumes:
      - ./config/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      observability-net:
      vlan20_servers:
        ipv4_address: 10.0.20.43
      # Allows the host to talk to the container
      default:
    mac_address: 02:42:0a:00:14:43
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  loki-proxy:
    image: alpine/socat
    container_name: loki-proxy
    restart: unless-stopped
    command: tcp-listen:3100,fork,reuseaddr tcp-connect:loki:3100
    ports:
      - "3100:3100"
    networks:
      - observability-net
      - default
    # Built from scratch - rely on restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "wget", "--spider", "-q", "http://localhost:9997/v3/config/paths"]
      # interval: 15s
      # timeout: 5s
      # retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
          pids: 100

  promtail:
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"
      - "wud.watch=true"
      - "wud.update=true"
      - "wud.update.type=patch"
      ## Ignore changes to digests to bring back latest ver num instead of tag
      - "wud.watch.digest=false"
    image: grafana/promtail:3.6.8@sha256:6cfa64ec432b24a912d640e2edb940eeae2666f61861a66c121d763dd7241381
    container_name: promtail
    <<: *default-logging
    restart: unless-stopped
    environment:
      CONFIG_HASH: ${STACK_CONFIG_HASH:-}
      TZ: America/Edmonton
    volumes:
      - ./config/promtail.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - observability-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Built from scratch - rely on restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "wget", "--spider", "-q", "http://localhost:9997/v3/config/paths"]
      # interval: 15s
      # timeout: 5s
      # retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
          pids: 100

  grafana:
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"
      - "wud.watch=true"
      - "wud.update=true"
      - "wud.update.type=patch"
      ## Ignore changes to digests to bring back latest ver num instead of tag
      - "wud.watch.digest=false"
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    container_name: grafana
    <<: *default-logging
    restart: unless-stopped
    user: "1000:1000"
    environment:
      CONFIG_HASH: ${STACK_CONFIG_HASH:-}
      GF_SERVER_ROOT_URL: https://grafana.sythsaz.ca
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Authentik"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "${GRAFANA_OAUTH_SECRET}"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://auth.sythsaz.ca/application/o/authorize/"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://auth.sythsaz.ca/application/o/token/"
      GF_AUTH_GENERIC_OAUTH_API_URL: "https://auth.sythsaz.ca/application/o/userinfo/"
      GF_AUTH_SIGNOUT_REDIRECT_URL: "https://auth.sythsaz.ca/application/o/grafana/end-session/"
      GF_AUTH_OAUTH_AUTO_LOGIN: "false"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'Grafana Admin') && 'Admin' || contains(groups[*], 'Grafana Editor') && 'Editor' || 'Viewer'"
      TZ: America/Edmonton
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana_provisioning:/etc/grafana/provisioning:ro
      - grafana_bundled_plugins:/usr/share/grafana/data/plugins-bundled
    networks:
      observability-net:
      vlan20_servers:
        ipv4_address: 10.0.20.41
    mac_address: 02:42:0a:00:14:41
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
          # JUSTIFICATION: Grafana's Go runtime spawns >100 OS threads during concurrent background plugin updates and indexing.
          pids: 250

  glances:
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"
      - "wud.watch=true"
      - "wud.update=true"
      - "wud.update.type=patch"
      ## Ignore changes to digests to bring back latest ver num instead of tag
      - "wud.watch.digest=false"
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: unless-stopped
    # ══════════════════════════════════════════════════════════
    # HOST NETWORK JUSTIFICATION:
    # Service: Glances
    # Reason: Requires network mode host to monitor host network interfaces
    # Reviewed: 2026-09-27
    # ══════════════════════════════════════════════════════════
    network_mode: host
    # ══════════════════════════════════════════════════════════
    # PID HOST JUSTIFICATION:
    # Service: Glances
    # Reason: Requires pid mode host to monitor host processes
    # Reviewed: 2026-09-27
    # ══════════════════════════════════════════════════════════
    pid: host
    environment:
      - GLANCES_OPT=-w
      - TZ=America/Edmonton
    volumes:
      - /etc/os-release:/etc/os-release:ro
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
          pids: 100

networks:
  observability-net:
    driver: bridge
    internal: true
    name: z_observability_net
  vlan20_servers:
    external: true
    name: infrastructure_vlan20_servers

volumes:
  loki_data:
  grafana_data:
  grafana_bundled_plugins:
