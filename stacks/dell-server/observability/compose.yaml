version: '3.8'

x-default-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "3"

services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    <<: *default-logging
    restart: unless-stopped
    user: "0:0"
    volumes:
      - ./config/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    networks:
      - observability-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    <<: *default-logging
    restart: unless-stopped
    volumes:
      - ./config/promtail.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - observability-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    <<: *default-logging
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://grafana.sythsaz.ca
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Authentik"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "${GRAFANA_OAUTH_SECRET}"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://auth.sythsaz.ca/application/o/authorize/"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://auth.sythsaz.ca/application/o/token/"
      GF_AUTH_GENERIC_OAUTH_API_URL: "https://auth.sythsaz.ca/application/o/userinfo/"
      GF_AUTH_SIGNOUT_REDIRECT_URL: "https://auth.sythsaz.ca/application/o/grafana/end-session/"
      GF_AUTH_OAUTH_AUTO_LOGIN: "false"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'Grafana Admin') && 'Admin' || contains(groups[*], 'Grafana Editor') && 'Editor' || 'Viewer'"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana_provisioning:/etc/grafana/provisioning:ro
    networks:
      observability-net:
      vlan20_servers:
        ipv4_address: 10.0.20.41
    mac_address: 02:42:0a:00:14:41
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

networks:
  observability-net:
    driver: bridge
    internal: true
    name: z_observability_net
  vlan20_servers:
    external: true
    name: infrastructure_vlan20_servers

volumes:
  loki_data:
  grafana_data:






