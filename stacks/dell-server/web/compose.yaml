x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "3"
      tag: "{{.Name}}/{{.ID}}"

services:
  redis:
    image: redis:8.10.1-alpine
    <<: *default-logging
    user: "999:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    command: ["sh", "-c", "redis-server --requirepass \"${WORDPRESS_REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${WORDPRESS_REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  db:
    image: mysql:8.0
    <<: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /var/run/mysqld:rw,noexec,nosuid,size=64m
      - /var/lib/mysql-files:rw,noexec,nosuid,size=64m
    volumes:
      - /home/hassio/mysql:/var/lib/mysql
    restart: unless-stopped
    networks:
      - db-net
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"${MYSQL_ROOT_PASSWORD}\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'

  wordpress:
    image: wordpress:7.1.0-php8.5-apache
    mac_address: 02:42:0a:00:14:16
    <<: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /run:rw,noexec,nosuid,size=64m
      - /var/run/apache2:rw,noexec,nosuid,size=64m
    volumes:
      - /home/hassio/wordpress:/var/www/html
      - ./config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./config/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ./config/php-security.ini:/usr/local/etc/php/conf.d/php-security.ini:ro
    restart: unless-stopped
    networks:
      db-net:
      vlan20_servers:
        ipv4_address: 10.0.20.22
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_REDIS_PASSWORD: ${WORDPRESS_REDIS_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/wp-includes/version.php"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'


networks:
  db-net:
    driver: bridge
    internal: true
    name: z_web_db-net
  vlan20_servers:
    external: true
    name: infrastructure_vlan20_servers

volumes:
  redis_data:






