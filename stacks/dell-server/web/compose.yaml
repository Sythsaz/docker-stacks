x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "3"
      tag: "{{.Name}}/{{.ID}}"

services:
  redis:
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"
      - "wud.watch=true"
      - "wud.trigger.type=discord"
      ## Ignore changes to digests to bring back latest ver num instead of tag
      - "wud.watch.digest=false"
    image: redis:8.10.1-alpine@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0
    <<: *default-logging
    user: "999:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      WORDPRESS_REDIS_PASSWORD: ${WORDPRESS_REDIS_PASSWORD}
      REDISCLI_AUTH: ${WORDPRESS_REDIS_PASSWORD}
    command: ["sh", "-c", "echo \"requirepass $$WORDPRESS_REDIS_PASSWORD\" > /tmp/redis.conf && exec redis-server /tmp/redis.conf"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
          pids: 200
        reservations:
          memory: 128M
          cpus: '0.1'

  db:
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"
      - "wud.watch=true"
      - "wud.trigger.type=discord"
      ## Ignore changes to digests to bring back latest ver num instead of tag
      - "wud.watch.digest=false"
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    <<: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /var/run/mysqld:rw,noexec,nosuid,size=64m
      - /var/lib/mysql-files:rw,noexec,nosuid,size=64m
    volumes:
      - /home/hassio/mysql:/var/lib/mysql
    restart: unless-stopped
    networks:
      - db-net
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1.0'
          pids: 200
        reservations:
          memory: 512M
          cpus: '0.25'

  wordpress:
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"
      - "wud.watch=true"
      - "wud.update=true"
      - "wud.update.type=patch"
      ## Ignore changes to digests to bring back latest ver num instead of tag
      - "wud.watch.digest=false"
    image: wordpress:7.1.0-php8.5-apache@sha256:a8ee182a3806f9bb9ec2a34851ecb0d8fc6fbf9e421198d2ca7aeaae4bdfc807
    mac_address: 02:42:0a:00:14:16
    <<: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /run:rw,noexec,nosuid,size=64m
      - /var/run/apache2:rw,noexec,nosuid,size=64m
    volumes:
      - /home/hassio/wordpress:/var/www/html
      - ./config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./config/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ./config/php-security.ini:/usr/local/etc/php/conf.d/php-security.ini:ro
    restart: unless-stopped
    networks:
      db-net:
      vlan20_servers:
        ipv4_address: 10.0.20.22
    environment:
      CONFIG_HASH: ${STACK_CONFIG_HASH:-}
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_REDIS_PASSWORD: ${WORDPRESS_REDIS_PASSWORD}
      TZ: America/Edmonton
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/wp-includes/version.php"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'
          pids: 200
        reservations:
          memory: 256M
          cpus: '0.25'


networks:
  db-net:
    driver: bridge
    internal: true
    name: z_web_db-net
  vlan20_servers:
    external: true
    name: infrastructure_vlan20_servers

volumes:
  redis_data:






