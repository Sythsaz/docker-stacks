; Hardened PHP configurations (2026 Zero-Trust Standard)
; Neutralizes 90%+ of unauthenticated WordPress plugin RCEs

; Disable dangerous functions that allow lateral host execution
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source

; Hide PHP version from headers
expose_php = Off

; Prevent URL-aware fopen (often used in remote file inclusion vulnerabilities)
allow_url_fopen = Off
allow_url_include = Off

; Restrict session cookies
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Strict"
session.use_strict_mode = 1
