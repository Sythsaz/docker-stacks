version: '3.8'

x-default-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "3"

services:
  infisical-redis:
    image: redis:7.2.4-alpine
    container_name: infisical-redis
    <<: *default-logging
    command: sh -c "echo \"requirepass $$INFISICAL_REDIS_PASSWORD\" > /tmp/redis.conf && chown redis:redis /tmp/redis.conf && exec setpriv --reuid redis --regid redis --clear-groups redis-server /tmp/redis.conf"
    restart: unless-stopped
    env_file:
      - ./secrets/infisical_env.txt
    networks:
      - security-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid
    healthcheck:
      test: ["CMD-SHELL", "export REDISCLI_AUTH=$$INFISICAL_REDIS_PASSWORD && redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  infisical-db:
    image: postgres:14-alpine
    container_name: infisical-db
    <<: *default-logging
    restart: unless-stopped
    env_file:
      - ./secrets/infisical_env.txt
    environment:
      POSTGRES_DB: infisical
      POSTGRES_USER: infisical
    networks:
      - security-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETGID
      - SETUID
    volumes:
      - /home/hassio/docker_volumes/infisical/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  infisical:
    image: infisical/infisical:latest
    container_name: infisical
    <<: *default-logging
    restart: unless-stopped
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_healthy
    env_file:
      - ./secrets/infisical_env.txt
    environment:
      NODE_ENV: production
      SITE_URL: https://secrets.sythsaz.ca
    networks:
      security-net:
      vlan20_servers:
        ipv4_address: 10.0.20.40
    mac_address: 02:42:0a:00:14:40
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  trivy:
    build:
      context: ./config
      dockerfile: Dockerfile.trivy
    container_name: trivy
    user: "1000:1000"
    <<: *default-logging
    environment:
      - DISCORD_WEBHOOK_URL=${discord_webhook_trivy_ha_auto}
    entrypoint: ["sh", "-c"]
    command: 
      - |
        chmod +x /usr/local/bin/trivy_scan_and_notify.sh
        while true; do
          /usr/local/bin/trivy_scan_and_notify.sh
          sleep 86400
        done
    volumes:
      - /home/hassio/docker_volumes/trivy/reports:/report
      - ./config/trivy_scan_and_notify.sh:/usr/local/bin/trivy_scan_and_notify.sh:ro
      - ./config/.trivyignore:/.trivyignore:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
      - /home/trivyuser/.cache/trivy:rw,exec,nosuid
    networks:
      socket-proxy-net:
      vlan20_servers:
        ipv4_address: 10.0.20.42
    mac_address: 02:42:0a:00:14:42
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

networks:
  security-net:
    driver: bridge
    internal: true
    name: z_security_net
  socket-proxy-net:
    external: true
  vlan20_servers:
    external: true
    name: infrastructure_vlan20_servers














