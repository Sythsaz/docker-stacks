review:
  genai:
    enabled: true
    alerts: true
    detections: true
    image_source: recordings
    additional_concerns:
      - animals that are not Harley, the dog who lives here
      - people throwing trash on the ground
      - cats walking through/loitering
      - birds loitering/interacting with trash
      - people visibly peeking over the fence into the backyard
    activity_context_prompt: "### Normal Activity Indicators (Level 0)\n- Known/verified
      people in any zone at any time\n- People with pets in any area\n- Deliveries
      or services during daytime/evening (9 AM - 6 PM): carrying packages to doors/porches,
      placing items, leaving\n- Services/maintenance workers with visible tools, uniforms,
      or service vehicles during daytime\n- Activity confined to public areas only
      (sidewalks, streets, alley) without entering property at any time\n\n### Suspicious
      Activity Indicators (Level 1)\n- **Testing or attempting to open doors/windows/handles
      on vehicles or buildings** — ALWAYS Level 1 regardless of time or duration\n\
      - **Unidentified person in private areas ( near vehicles/buildings, in the Backyard
      Parking Pad) during late night/early morning (11 PM - 5 AM)** — ALWAYS Level
      1 regardless of activity or duration\n- Taking items that don't belong to them
      (packages, objects from porches/driveways)\n- Climbing or jumping fences/barriers
      to access property\n- Attempting to conceal actions or items from view\n- Prolonged
      loitering: remaining in the same area without a visible purpose throughout most
      of the sequence\n\n### Critical Threat Indicators (Level 2)\n- Holding break-in
      tools (crowbars, pry bars, bolt cutters, etc.)\n- Weapons visible (guns, knives,
      baseball bats used aggressively, etc.)\n- Forced entry in progress\n- Physical
      aggression or violence\n- Active property damage or theft in progress\n- Harley
      leaving without a person\n\n### Assessment Guidance\nEvaluate in this order:\n\
      \n1. **If person is verified/known** → Level 0 regardless of time or activity\n\
      2. **If person is unidentified:**\n- Check time: If late night/early morning
      (9 PM - 6 AM) AND in private areas (driveways, near vehicles/buildings, main
      Backyard Zone) → Level 1\n- Check actions: If testing doors/handles, taking
      items, climbing → Level 1\n- Otherwise, if daytime/evening (9 AM - 6 PM) with
      a clear legitimate purpose (delivery, service worker) → Level 0\n3. **Escalate
      to Level 2 if:** Any kind of weapons, break-in tools, forced entry in progress,
      violence, active property damage visible, if Harley leaves through the fence
      gate without any person (escalates from Level 0 or 1)\n\nThe mere presence of
      an unidentified person in private areas during late-night hours is inherently
      suspicious and warrants human review, regardless of what activity they appear
      to be doing or how brief the sequence is.\n\nSTRICT REQUIREMENT: Provide the
      response ONLY as a raw, valid JSON object. Do not include markdown formatting,
      conversational text, or code blocks.\n"
  alerts:
    labels:
      - person
      - car
      - cat
      - dog
      - backpack
      - frisbee
      - bird
    cutoff_time: 80
  detections:
    labels:
      - car
      - cat
      - dog
      - person
      - backpack
      - frisbee
      - bird
    cutoff_time: 80
objects:
  genai:
    enabled: true
    prompt: "Analyze the {label} in these images from the {camera} security camera.
      Focus on the actions, behaviour, and potential intent of the {label}, rather
      than just describing its appearance, but don't skip describing its appearance
      entirely.\nThe Backyard Camera has older infared night vision, so at night the
      image is greyscale instead of color during the day. People/Objects may be moving
      slowly, frame by frame movement may appear nearly stationary, but actually is
      slightly moving.\n\n### Spatial Context for this Camera:\n- Backyard: The main
      grass area in the view. There is a table, umbrella, and 0-4 chairs that don't
      need to be mentioned unless involved in a Level 1 or 2 Alert. \n- Back_Alley:
      The public alley access road going across the right and left near the top behind
      the fence.\n- Parking_Pad: The car parking spot, in between the Backyard and
      Alley, just outside of the fence gate.\n- Neighbours_Yard: Any backyard that
      is not the main backyard or the alley. These normally have a motion mask enabled
      unless the whole area needs to be monitored.\n"
    object_prompts:
      person: "Examine the main person in these images. What are they doing and what
        might their actions suggest about their intent (e.g., approaching a door,
        leaving an area, standing still)? Do not describe the surroundings or static
        details.\nIf the person is recognized via {sub_label} as Ashton (owner/operator),
        Kit (common-law partner), Tristan (friend), or Jeff (friend), note their presence
        as normal and verified.\n"
      car: "Observe the primary vehicle in these images. Focus on its movement, direction,
        or purpose (e.g., parking, approaching, circling). If it's a delivery vehicle,
        mention the company.\n"
      cat: "Observe the cat in these images. Focus on its movement and intent (e.g.,
        wandering, hunting, interacting with objects). If the cat is engaging in any
        specific actions, mention it.\n"
      dog: "Observe the dog in these images. Focus on its movement and intent (e.g.,
        running, hunting, digging (digging spots are all in the Backyard; he usually
        prefers digging in corners), barking). \nIf the dog is recognized via {sub_label}
        as Harley, see if he is digging or barking at other animals. Harley interacting
        with people other than Ashton, Kit, Jeff, or Tristan is abnormal and should
        be immediately investigated.\n"
    objects:
      - cat
      - dog
      - person
      - frisbee
      - car
      - backpack
      - bird
    use_snapshot: true
    send_triggers:
      after_significant_updates: 2
  track:
    - backpack
    - car
    - cat
    - dog
    - frisbee
    - person
    - bird
  filters:
    person:
      threshold: 0.82
    bird:
      max_area: 50000
      threshold: 0.8
    backpack:
      min_score: 0.8
      threshold: 0.8
    car:
      threshold: 0.8
    cat:
      threshold: 0.8
    dog:
      threshold: 0.8
      min_ratio: 1.5
    frisbee:
      threshold: 0.8
