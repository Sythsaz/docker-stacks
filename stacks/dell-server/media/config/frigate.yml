go2rtc:
  ffmpeg:
    global: -vaapi_device /dev/dri/renderD128   # Forces FFmpeg 8 to use your Intel iGPU for transcoding
  webrtc:
    candidates:
      - 10.0.20.25:8555
      - stun:8555
  streams:
    # 1. The WebRTC Stream (For the UI and Mic Button): Keeps the Opus speaker track intact
    backyard_camera_hq:
      - rtsp://admin:023415@10.0.40.103:554/live/profile.0#tcp

    # 2. The FFmpeg Stream (For Recording): Drops the Opus track to prevent FFmpeg from crashing
    backyard_camera_hq_ffmpeg:
      - rtsp://admin:023415@10.0.40.103:554/live/profile.0#tcp#video=h264#audio=aac

    # LQ Stream: Force TCP, grab H264 video, completely drop all audio
    backyard_camera_lq:
      - rtsp://admin:023415@10.0.40.103:554/live/profile.1#tcp#video=h264

cameras:
  backyard_camera_hq:
    enabled: true
    ffmpeg:
      hwaccel_args: preset-vaapi
      output_args:
        record: preset-record-generic-audio-copy
      inputs:
        # HQ Input: Point this to the scrubbed "_ffmpeg" stream so it doesn't crash!
        - path: rtsp://127.0.0.1:8554/backyard_camera_hq_ffmpeg
          input_args: preset-rtsp-restream
          roles:
            - record
            - audio

        # LQ Input: Feeds the detection engine
        - path: rtsp://127.0.0.1:8554/backyard_camera_lq
          input_args: preset-rtsp-restream
          roles:
            - detect

    # Optional ONVIF block (You can leave this here, Frigate will just ignore the PTZ error)
