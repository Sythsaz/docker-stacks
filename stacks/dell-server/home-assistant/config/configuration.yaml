python_script:

pyscript:
  allow_all_imports: true
  requirements:
    - PyJWT
  apps:
    wordpress_publisher:
      wp_url: "https://sythsaz.ca/wp-json/wp/v2/posts"
      wp_user: !secret wp_api_username
      wp_pass: !secret wp_api_password

template:
  - trigger:
      - platform: event
        event_type: imap_content
        event_data:
          username: !secret event_imap_username_ash
          sender: !secret event_imap_sender
    sensor:
      - name: !secret event_imap_sensor_name_ash
        state: "{{ trigger.event.data.subject }}"
        attributes:
          from_address: "{{ trigger.event.data.sender }}"
          received_at: "{{ trigger.event.data.date }}"
          email_body: "{{ trigger.event.data.text }}"
      - name: "Latest Twitch Follower"
        unique_id: twitch_follower_detailed
        icon: mdi:twitch
        state: >
          {% set subject = trigger.event.data.subject %}
          {% set sender = trigger.event.data.sender %}
          {% if 'is now following you on Twitch' in subject and 'no-reply@twitch.tv' in sender %}
            {{ subject | replace(' is now following you on Twitch', '') }}
          {% else %}
            {{ this.state if this.state is defined else 'Unknown' }}
          {% endif %}
        attributes:
          received_at: "{{ trigger.event.data.date }}"
          full_subject: "{{ trigger.event.data.subject }}"
          profile_url: >
            {% set name = trigger.event.data.subject | replace(' is now following you on Twitch', '') %}
            https://www.twitch.tv/{{ name | trim | lower }}
          message_preview: "{{ trigger.event.data.text[:255] if trigger.event.data.text is defined else 'N/A' }}"
      - name: "Dashboard User Activity"
        unique_id: dashboard_user_activity
        icon: mdi:monitor-dashboard
        device_class: timestamp
        state: >
          {% set browser_sensors = states.sensor | selectattr('entity_id', 'search', '_browser_user') | list %}
          {% set active_sensors = browser_sensors | rejectattr('state', 'in', ['unknown', 'unavailable']) | list %}
          {{ active_sensors | map(attribute='last_updated') | list | sort | last | default(now()) }}
        attributes:
          active_count: >
            {% set browser_sensors = states.sensor | selectattr('entity_id', 'search', '_browser_user') | list %}
            {{ browser_sensors | rejectattr('state', 'in', ['unknown', 'unavailable']) | list | count }}
          is_active: >
            {% set browser_sensors = states.sensor | selectattr('entity_id', 'search', '_browser_user') | list %}
            {{ (browser_sensors | rejectattr('state', 'in', ['unknown', 'unavailable']) | list | count) > 0 }}

  - trigger:
      - platform: event
        event_type: imap_content
        event_data:
          username: !secret event_imap_username_kit
          sender: !secret event_imap_sender
    sensor:
      - name: !secret event_imap_sensor_name_kit
        state: "{{ trigger.event.data.subject }}"
        attributes:
          from_address: "{{ trigger.event.data.sender }}"
          received_at: "{{ trigger.event.data.date }}"
          email_body: "{{ trigger.event.data.text }}"

shell_command:
    create_gif_hwy3: !secret create_gif_hwy3_cmd
    create_gif_wude: !secret create_gif_wude_cmd
    create_gif_wudw: !secret create_gif_wudw_cmd
    create_gif_wude4: !secret create_gif_wude4_cmd
    create_gif_wudw2: !secret create_gif_wudw2_cmd
    apt_update_check: !secret apt_update_check
    apt_perform_upgrade: !secret apt_perform_upgrade
    ha_send_sensor: !secret send_data_to_wp
    ha_send_radar: !secret send_radar_to_wp
    export_traccar_route: >
      curl -k -s -H "Authorization: Bearer {{ token }}" -G "{{ url }}/api/reports/route/xlsx" --data-urlencode "deviceId={{ device_id }}" --data-urlencode "from={{ from_time }}" --data-urlencode "to={{ to_time }}" -o "/config/downloads/traccar/route_{{ device_id }}_{{ date_str }}.xlsx"
    gfs_backup_weekly: !secret gfs_backup_weekly
    gfs_backup_monthly: !secret gfs_backup_monthly
