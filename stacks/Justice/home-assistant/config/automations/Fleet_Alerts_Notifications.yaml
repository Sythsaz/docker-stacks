# ==============================================================================
# Fleet Alerts & Self-Healing Notifications (Justice Hub — Accessible Alerts)
# Designed for Justice: Zero motor-demand notifications, informational display
# ==============================================================================

- id: 'fleet_alerts_notification_engine_justice'
  alias: 'Fleet Alerts & Self-Healing Notifications'
  description: 'Ingests fleet events, handles all severity levels, creates persistent dashboard notifications, dispatches accessible mobile notifications to Justice phone without interactive action demands, and auto-dismisses on resolution.'
  triggers:
    - trigger: webhook
      webhook_id: fleet_alert
      allowed_methods:
        - POST
        - PUT
      local_only: false
  conditions: []
  actions:
    - variables:
        sev: "{{ (trigger.json.severity | default('WARN')) | upper }}"
        host: "{{ trigger.json.hostname | default(trigger.json.host | default('Justice')) }}"
        metric_name: "{{ trigger.json.metric | default(trigger.json.service | default('general')) }}"
        notif_id: "{{ trigger.json.notification_id | default('fleet_' ~ host ~ '_' ~ metric_name) }}"
        notif_tag: "{{ host }}_{{ metric_name }}"
        alert_title: "{{ trigger.json.title | default('[' ~ sev ~ '] ' ~ host ~ ': ' ~ metric_name) }}"
        alert_msg: "{{ trigger.json.message | default(trigger.json.msg | default('Alert event reported on ' ~ host)) }}"

    - choose:
        # 1. RESOLVED / OK / CLEARED -> Auto-Dismiss Active Notification & Clear Phone
        - conditions:
            - condition: template
              value_template: "{{ sev in ['RESOLVED', 'OK', 'CLEARED'] }}"
          sequence:
            - action: persistent_notification.dismiss
              data:
                notification_id: "{{ notif_id }}"
            - action: notify.mobile_app_jusparrs22
              continue_on_error: true
              data:
                message: "clear_notification"
                data:
                  tag: "{{ notif_tag }}"

        # 2. CRITICAL or ERROR -> High Priority Alert (No Interactive Action Buttons)
        - conditions:
            - condition: template
              value_template: "{{ sev in ['CRITICAL', 'ERROR', 'FATAL'] }}"
          sequence:
            - action: persistent_notification.create
              data:
                title: "🚨 {{ alert_title }}"
                message: |
                  **{{ alert_msg }}**

                  - **Host:** `{{ host }}`
                  - **Metric / Service:** `{{ metric_name }}`
                  - **Severity:** `{{ sev }}`
                  - **Timestamp:** `{{ now().strftime('%Y-%m-%d %H:%M:%S') }}`
                notification_id: "{{ notif_id }}"
            - action: notify.mobile_app_jusparrs22
              continue_on_error: true
              data:
                title: "🚨 {{ alert_title }}"
                message: "{{ alert_msg }}"
                data:
                  tag: "{{ notif_tag }}"
                  group: "fleet-alerts"
                  channel: "Fleet Critical"
                  importance: high
                  priority: high
                  color: "#E53935"
                  push:
                    sound:
                      name: default
                      critical: 1
                      volume: 1.0

        # 3. WARN -> Standard Alert (No Interactive Action Buttons)
        - conditions:
            - condition: template
              value_template: "{{ sev in ['WARN', 'WARNING'] }}"
          sequence:
            - action: persistent_notification.create
              data:
                title: "⚠️ {{ alert_title }}"
                message: |
                  {{ alert_msg }}

                  - **Host:** `{{ host }}`
                  - **Metric:** `{{ metric_name }}`
                notification_id: "{{ notif_id }}"
            - action: notify.mobile_app_jusparrs22
              continue_on_error: true
              data:
                title: "⚠️ {{ alert_title }}"
                message: "{{ alert_msg }}"
                data:
                  tag: "{{ notif_tag }}"
                  group: "fleet-alerts"
                  channel: "Fleet Alerts"
                  importance: default
                  priority: default
                  color: "#FFA000"
                  push:
                    sound: default

        # 4. INFO / DEFAULT -> Low Priority Informational Notification
        - conditions: []
          sequence:
            - action: notify.mobile_app_jusparrs22
              continue_on_error: true
              data:
                title: "ℹ️ {{ alert_title }}"
                message: "{{ alert_msg }}"
                data:
                  tag: "{{ notif_tag }}"
                  group: "fleet-alerts"
                  channel: "Fleet Info"
                  importance: low
                  priority: low
                  color: "#1E88E5"
  mode: queued
  max: 30
