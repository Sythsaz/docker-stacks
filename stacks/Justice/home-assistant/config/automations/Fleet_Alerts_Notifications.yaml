# ==============================================================================
# Fleet Alerts & Self-Healing Notifications (Justice Hub — Accessible Alerts)
# Designed for Justice: Zero motor-demand notifications, informational display
# ==============================================================================

- id: 'fleet_alerts_notification_engine_justice'
  alias: 'Fleet Alerts & Self-Healing Notifications'
  description: 'Ingests fleet events, handles all severity levels, creates persistent dashboard notifications, dispatches accessible mobile notifications to Justice phone without interactive action demands, and auto-dismisses on resolution.'
  triggers:
    - trigger: webhook
      webhook_id: fleet_alert
      allowed_methods:
        - POST
        - PUT
      local_only: false
  conditions: []
  actions:
    - variables:
        payload: "{{ trigger.json if (trigger is defined and trigger.json is mapping) else {} }}"
        sev: "{{ (payload.get('severity') | default('WARN', true)) | upper }}"
        host: "{{ payload.get('hostname') | default(payload.get('host') | default('Justice', true), true) }}"
        metric_name: "{{ payload.get('metric') | default(payload.get('service') | default(payload.get('text', '').split(' ')[1] if (payload.get('text') is string and 'Container ' in payload.get('text', '')) else 'general', true), true) }}"
        notif_tag: "{{ payload.get('tag') | default(payload.get('notif_tag') | default(host ~ '_' ~ metric_name, true), true) }}"
        notif_id: "{{ payload.get('notification_id') | default('fleet_' ~ notif_tag, true) }}"
        alert_title: "{{ payload.get('title') | default('[' ~ sev ~ '] ' ~ host ~ ': ' ~ metric_name, true) }}"
        alert_msg: "{{ payload.get('message') | default(payload.get('msg') | default(payload.get('text') | default('Alert event reported on ' ~ host, true), true), true) }}"
        target_url: "{{ payload.get('url') | default('/lovelace', true) }}"

    - choose:
        # 1. RESOLVED / OK / CLEARED -> Auto-Dismiss Active Notification & Clear Phone
        - conditions:
            - condition: template
              value_template: "{{ sev in ['RESOLVED', 'OK', 'CLEARED'] }}"
          sequence:
            - action: persistent_notification.dismiss
              data:
                notification_id: "{{ notif_id }}"
            - action: notify.mobile_app_jusparrs22
              continue_on_error: true
              data:
                message: "clear_notification"
                data:
                  tag: "{{ notif_tag }}"

        # 2. CRITICAL or ERROR -> High Priority Alert (No Interactive Action Buttons)
        - conditions:
            - condition: template
              value_template: "{{ sev in ['CRITICAL', 'ERROR', 'FATAL'] }}"
          sequence:
            - action: persistent_notification.create
              data:
                title: "🚨 {{ alert_title }}"
                message: |
                  **{{ alert_msg }}**

                  - **Host:** `{{ host }}`
                  - **Metric / Service:** `{{ metric_name }}`
                  - **Severity:** `{{ sev }}`
                  - **Timestamp:** `{{ now().strftime('%Y-%m-%d %H:%M:%S') }}`
                notification_id: "{{ notif_id }}"
            - action: notify.mobile_app_jusparrs22
              continue_on_error: true
              data:
                title: "🚨 {{ alert_title }}"
                message: "{{ alert_msg }}"
                data:
                  tag: "{{ notif_tag }}"
                  group: "fleet-alerts"
                  channel: "Fleet Critical"
                  importance: high
                  priority: high
                  color: "#E53935"
                  clickAction: "{{ target_url }}"
                  url: "{{ target_url }}"
                  push:
                    sound:
                      name: default
                      critical: 1
                      volume: 1.0

        # 3. WARN -> Standard Alert (No Interactive Action Buttons)
        - conditions:
            - condition: template
              value_template: "{{ sev in ['WARN', 'WARNING'] }}"
          sequence:
            - action: persistent_notification.create
              data:
                title: "⚠️ {{ alert_title }}"
                message: |
                  {{ alert_msg }}

                  - **Host:** `{{ host }}`
                  - **Metric:** `{{ metric_name }}`
                notification_id: "{{ notif_id }}"
            - action: notify.mobile_app_jusparrs22
              continue_on_error: true
              data:
                title: "⚠️ {{ alert_title }}"
                message: "{{ alert_msg }}"
                data:
                  tag: "{{ notif_tag }}"
                  group: "fleet-alerts"
                  channel: "Fleet Alerts"
                  importance: default
                  priority: default
                  color: "#FFA000"
                  clickAction: "{{ target_url }}"
                  url: "{{ target_url }}"
                  push:
                    sound: default

        # 4. INFO / DEFAULT -> Low Priority Informational Notification
        - conditions: []
          sequence:
            - action: notify.mobile_app_jusparrs22
              continue_on_error: true
              data:
                title: "ℹ️ {{ alert_title }}"
                message: "{{ alert_msg }}"
                data:
                  tag: "{{ notif_tag }}"
                  group: "fleet-alerts"
                  channel: "Fleet Info"
                  importance: low
                  priority: low
                  color: "#1E88E5"
                  clickAction: "{{ target_url }}"
                  url: "{{ target_url }}"
  mode: queued
  max: 30
